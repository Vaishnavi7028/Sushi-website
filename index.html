<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sushi 🐾 - The Cutest Cat</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --baby-pink: #ffb3c6;
            --soft-pink: #ffe5ec;
            --deep-pink: #ff758c;
            --dark-pink: #d85770;
            --text-dark: #4a403a;
            --white: #ffffff;
            --shadow: 0 10px 30px rgba(255, 179, 198, 0.3);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fff0f3 0%, #ffe5ec 50%, #ffccd5 100%);
            color: var(--text-dark);
            min-height: 100vh;
            overflow-x: hidden;
            position: relative;
        }

        /* 15 Floating Baby Pink Paw Stickers */
        .paw-sticker {
            position: absolute;
            width: 45px;
            height: 45px;
            opacity: 0.25;
            pointer-events: none;
            animation: floatPaw 7s ease-in-out infinite;
            z-index: 0;
        }

        @keyframes floatPaw {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            50% { transform: translateY(-15px) rotate(12deg); }
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding: 40px 20px;
            position: relative;
            z-index: 1;
        }

        .header-card {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            box-shadow: var(--shadow);
            border: 3px solid var(--baby-pink);
            margin-bottom: 30px;
            position: relative;
        }

        .hero-img-container {
            width: 180px;
            height: 180px;
            margin: 0 auto 15px;
            border-radius: 50%;
            padding: 5px;
            background: linear-gradient(45deg, var(--deep-pink), var(--baby-pink));
            box-shadow: 0 8px 25px rgba(216, 87, 112, 0.2);
            cursor: pointer;
            transition: transform 0.3s ease;
        }

        .hero-img-container:hover {
            transform: scale(1.05);
        }

        .hero-img-container img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
        }

        /* Contact Owner Action Button */
        .contact-owner-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: linear-gradient(135deg, var(--deep-pink), var(--dark-pink));
            color: white;
            padding: 10px 22px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 600;
            text-decoration: none;
            box-shadow: 0 5px 15px rgba(216, 87, 112, 0.3);
            margin-top: 10px;
            margin-bottom: 15px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .contact-owner-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 20px rgba(216, 87, 112, 0.4);
        }

        h1 {
            font-family: 'Quicksand', sans-serif;
            font-size: 2.8rem;
            color: var(--dark-pink);
            margin-bottom: 10px;
        }

        .top-contacts {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-top: 15px;
        }

        .contact-badge {
            background: var(--soft-pink);
            border: 2px dashed var(--deep-pink);
            padding: 10px 20px;
            border-radius: 50px;
            font-size: 0.95rem;
            font-weight: 500;
            color: var(--text-dark);
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 4px 15px rgba(255, 179, 198, 0.3);
            transition: transform 0.2s;
        }

        .contact-badge:hover {
            transform: translateY(-2px);
        }

        .contact-badge a {
            color: var(--dark-pink);
            text-decoration: none;
            font-weight: 600;
        }

        .info-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-bottom: 35px;
        }

        .info-card {
            background: rgba(255, 255, 255, 0.9);
            padding: 20px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(255, 179, 198, 0.2);
            border: 2px solid var(--soft-pink);
            transition: transform 0.3s ease;
        }

        .info-card:hover {
            transform: translateY(-5px);
        }

        .info-card .icon {
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .info-card h3 {
            font-size: 0.9rem;
            color: #b56576;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 5px;
        }

        .info-card p {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text-dark);
        }

        .gallery-section {
            background: rgba(255, 255, 255, 0.95);
            border-radius: 30px;
            padding: 35px 30px;
            box-shadow: var(--shadow);
            border: 3px solid var(--baby-pink);
        }

        .gallery-title {
            font-family: 'Quicksand', sans-serif;
            font-size: 1.8rem;
            text-align: center;
            color: var(--dark-pink);
            margin-bottom: 25px;
        }

        .photo-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
            gap: 20px;
        }

        .photo-item {
            position: relative;
            border-radius: 20px;
            overflow: hidden;
            height: 220px;
            box-shadow: 0 6px 20px rgba(0,0,0,0.08);
            cursor: pointer;
            border: 3px solid var(--white);
            transition: transform 0.3s ease;
        }

        .photo-item:hover {
            transform: scale(1.03);
        }

        .photo-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.5s ease;
        }

        .photo-item:hover img {
            transform: scale(1.1);
        }

        .photo-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(216, 87, 112, 0.6), transparent);
            opacity: 0;
            transition: opacity 0.3s ease;
            display: flex;
            align-items: flex-end;
            padding: 15px;
            color: white;
            font-weight: 500;
        }

        .photo-item:hover .photo-overlay {
            opacity: 1;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.8);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }

        .lightbox.active {
            display: flex;
        }

        .lightbox img {
            max-width: 90%;
            max-height: 85vh;
            border-radius: 20px;
            border: 4px solid white;
        }

        .lightbox-close {
            position: absolute;
            top: 25px;
            right: 30px;
            background: white;
            border: none;
            width: 45px;
            height: 45px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
        }

        footer {
            text-align: center;
            margin-top: 40px;
            font-size: 0.9rem;
            color: #b56576;
            padding-bottom: 20px;
        }

        footer span {
            color: var(--deep-pink);
        }
    </style>
</head>

    <script>
        function openLightbox(imgSrc) {
